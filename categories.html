<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kategorijas">
    <title>Kategorijas — Viesnīcu rezervācija</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar sticky-top">
        <div class="container-fluid">
            <div class="navbar-content">
                <a href="index.html" class="navbar-brand">
                    <div class="brand-icon">🏨</div>
                    <span class="brand-text">Viesnīcu rezervācija</span>
                </a>
                <nav class="navbar-nav">
                    <a href="stays.html" class="nav-link">Numuri</a>
                    <a href="features.html" class="nav-link">Priekšrocības</a>
                    <a href="about.html" class="nav-link">Par mums</a>
                    <button class="btn-link nav-link" id="authBtn">Pieslēgties</button>
                </nav>
            </div>
        </div>
    </header>

    <section class="categories">
        <div class="container">
            <div class="categories-scroll" id="categoriesContainer">
                <button class="category-btn active" data-category="Viss">Viss</button>
                <button class="category-btn" data-category="Skats uz pilsētu">Skats uz pilsētu</button>
                <button class="category-btn" data-category="Dārzs">Dārzs</button>
                <button class="category-btn" data-category="Ģimene">Ģimene</button>
                <button class="category-btn" data-category="Luksusa numuri">Luksusa numuri</button>
                <button class="category-btn" data-category="Mājdzīvniekiem draudzīgs">Mājdzīvniekiem draudzīgs</button>
                <button class="category-btn" data-category="Darba ceļojumiem">Darba ceļojumiem</button>
                <button class="category-btn" data-category="Spa">Spa</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Viesnīcu rezervācija.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>

    <!-- Authentication Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content modal-sm">
            <button class="modal-close" id="authModalClose">&times;</button>
            <div class="modal-body">
                <h2 id="authTitle">Pieslēgties</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="authEmail">E-pasts</label>
                        <input type="email" id="authEmail" placeholder="jusu@epasts.lv" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label for="authPassword">Parole</label>
                        <input type="password" id="authPassword" placeholder="Parole" required>
                    </div>
                    <div class="auth-actions">
                        <button type="submit" class="btn-primary" id="loginSubmit">Pieslēgties</button>
                        <button type="button" class="btn-secondary" id="showSignup">Reģistrēties</button>
                    </div>
                </form>
                <div style="margin-top:12px; font-size: 13px; color: var(--text-muted);">
                    <button class="btn-link" id="magicLinkBtn">Sūtīt pieslēgšanas saiti (bez paroles)</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
